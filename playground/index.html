<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<title>Металлоконструкции — playground</title>
		<style>
			body {
				font-family: system-ui, sans-serif;
				max-width: 1100px;
				margin: 2rem auto;
				padding: 0 1rem;
			}
			#controls {
				display: flex;
				gap: 1rem;
				flex-wrap: wrap;
				margin-bottom: 1rem;
			}
			#controls label {
				display: flex;
				flex-direction: column;
				font-size: 13px;
				gap: 4px;
			}
			#controls input {
				padding: 6px 8px;
				border: 1px solid #ccc;
				border-radius: 4px;
				width: 130px;
			}
			#canvas {
				border: 1px solid #ddd;
			}
			table {
				border-collapse: collapse;
				margin-top: 1.5rem;
				font-size: 14px;
			}
			th,
			td {
				border: 1px solid #ddd;
				padding: 6px 10px;
				text-align: left;
			}
			th {
				background: #f4f4f4;
			}
		</style>
	</head>
	<body>
		<h1>Playground</h1>
		<div id="controls"></div>
		<div id="canvas"></div>
		<div id="bom"></div>

		<script type="module" src="./main.ts"></script>
	</body>
</html>
